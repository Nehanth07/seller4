<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interrentcars Opening Animation</title>
    <style>
        @font-face {
            font-family: 'Telegraf';
            font-style: normal;
            font-weight: 400;
            src: url('./telegraf/PPTelegraf-Regular.woff2') format('woff2');
            font-display: swap;
            text-rendering: optimizeLegibility;
        }

        /* CSS Reset and Base Styles */
        body {
            margin: 0;
            overflow: hidden; /* Lock scrolling during animation */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4; /* Background of your actual site */
        }

        /* The Overlay Container */
        .opening-sequence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Allows clicking through after it's done */
        }

        /* The Split Backgrounds */
        .panel {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50vw;
            background-color: #111; /* Dark background for the intro */
            z-index: 1;
        }
        .left-panel { left: 0; }
        .right-panel { right: 0; }

        /* The Text Styling (Handwritten Solid Reveal via Masking) */
        .brand-svg {
            position: relative;
            z-index: 2;
            width: 90vw;
            max-width: 1000px;
            height: auto;
        }

        #brandText, #maskText {
            font-family: 'Telegraf', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 5rem;
            font-weight: 400; /* Updated to match Telegraf's weight */
            letter-spacing: 5px;
            text-transform: uppercase;
            text-rendering: optimizeLegibility; /* Ensures the curves of the font render smoothly */
        }

        .mask-char {
            /* Start fully hidden for the drawing effect */
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
        }

        /* Responsive text for smaller screens */
        @media (max-width: 768px) {
            #brandText, #maskText {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }
        }

        /* Styling the dummy home page */
        .home-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .home-page h1 {
            font-size: 3rem;
            color: #222;
            margin-bottom: 15px;
        }

        .home-page p {
            font-size: 1.2rem;
            color: #555;
            max-width: 600px;
            line-height: 1.6;
        }

        .replay-btn {
            margin-top: 30px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            transition: background 0.3s, transform 0.2s;
        }

        .replay-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- The Animation Overlay -->
    <div class="opening-sequence">
        <!-- The two halves of the screen -->
        <div class="panel left-panel"></div>
        <div class="panel right-panel"></div>
        
        <!-- The Title as an SVG using a thick stroke mask to simulate writing -->
        <svg class="brand-svg" viewBox="0 0 1000 200">
            <defs>
                <mask id="write-mask">
                    <text id="maskText" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                          fill="none" stroke="#ffffff" stroke-width="20"
                          stroke-linecap="round" stroke-linejoin="round">interrentcars</text>
                </mask>
            </defs>
            <text id="brandText" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                  fill="#ffffff" mask="url(#write-mask)">interrentcars</text>
        </svg>
    </div>

    <!-- Your Actual Home Page Content -->
    <main class="home-page">
        <h1>Welcome to Interrentcars</h1>
        <p>This is where your main website content will live. Notice how you can now scroll and interact with the page because the animation overlay has parted!</p>
        <button class="replay-btn" onclick="location.reload()">Replay Animation</button>
    </main>

    <!-- Load GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            // Setup the SVG letters for the handwriting mask effect
            const maskText = document.getElementById('maskText');
            const brandText = document.getElementById('brandText');
            const textStr = brandText.textContent;
            
            maskText.innerHTML = '';
            brandText.innerHTML = '';

            // Split into individual tspan elements so they can animate concurrently
            textStr.split('').forEach(char => {
                // The thick drawing stroke (acts as a mask)
                const spanMask = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
                spanMask.textContent = char;
                spanMask.setAttribute("class", "mask-char");
                maskText.appendChild(spanMask);

                // The solid visible text
                const spanSolid = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
                spanSolid.textContent = char;
                brandText.appendChild(spanSolid);
            });

            // Create the GSAP Timeline
            const tl = gsap.timeline({
                onComplete: () => {
                    // Re-enable scrolling once the animation is fully finished
                    document.body.style.overflow = 'auto';
                }
            });

            // Step 1: Draw the thick mask strokes concurrently.
            // Slower duration and a more premium easing curve for a luxurious feel.
            tl.to('.mask-char', {
                strokeDashoffset: 0,
                duration: 5.0, // Increased to 5s for an ultra-smooth, premium reveal
                ease: "power4.inOut", // power4 gives the silkiest, most dramatic easing curve
                stagger: 0 // Setting stagger to 0 means every letter draws at the EXACT same time
            })

            // Step 2: Wait exactly 1 second after the word finishes forming
            .to({}, { duration: 1.0 })

            // Step 3: Fade out the text smoothly before splitting
            .to('.brand-svg', {
                opacity: 0,
                duration: 0.8, // Slower, softer fade out
                ease: "power2.inOut"
            })

            // Step 4: The Split! Left panel goes left, right panel goes right
            .to('.left-panel', {
                xPercent: -100,
                duration: 1.8, // Slower, heavier "door" reveal
                ease: "power4.inOut"
            }, "-=0.2")
            .to('.right-panel', {
                xPercent: 100,
                duration: 1.8, // Slower, heavier "door" reveal
                ease: "power4.inOut"
            }, "<");
        });
    </script>
</body>
</html>
