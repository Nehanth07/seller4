<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitesized Footer Replicated</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Caveat:wght@600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP for Scroll Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'bricolage': ['"Bricolage Grotesque"', 'sans-serif'],
                        'caveat': ['"Caveat"', 'cursive'],
                        'inter': ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        'brand-cream': '#FDF8F0',
                        'brand-red': '#F95335',
                        'brand-yellow': '#FDBB11',
                        'brand-green': '#4ADE80',
                        'brand-blue': '#2563EB',
                        'brand-black': '#1A1A1A',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom grid pattern background */
        .pattern-grid {
            background-image: 
                linear-gradient(to right, #1A1A1A 2px, transparent 2px),
                linear-gradient(to bottom, #1A1A1A 2px, transparent 2px);
            background-size: 80px 80px;
            background-position: center top;
        }
    </style>
</head>
<body class="bg-brand-cream text-brand-black min-h-screen flex flex-col font-inter overflow-x-hidden">

    <!-- Hero / Spacer to allow scrolling -->
    <main class="flex-grow flex items-center justify-center min-h-[100vh] bg-brand-cream relative z-50">
        <div class="text-center space-y-6 px-6 max-w-2xl mx-auto">
            <h1 class="font-bricolage text-6xl md:text-8xl font-extrabold tracking-tighter text-brand-black leading-none">
                Scroll Down.
            </h1>
            <p class="font-inter text-xl md:text-2xl text-brand-black/80 font-semibold">
                Keep scrolling to see the zipper and parallax footer magic in action 👇
            </p>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="w-full relative bg-brand-cream">
        
        <!-- Red Zip Section -->
        <div id="zip-section" class="relative w-full h-[100vh] overflow-hidden bg-brand-black border-y-0">
            
            <!-- Interactive Elements Layer (Parallax Content) -->
            <div id="parallax-content" class="absolute inset-0 w-full h-full bg-brand-red flex items-center justify-center origin-center">
                <!-- Grid Overlay -->
                <div class="absolute inset-0 pattern-grid opacity-100 z-0 mix-blend-multiply"></div>

                <div class="relative z-20 w-full max-w-5xl mx-auto h-full flex items-center justify-center">
                    <!-- Left Green Ticket Sticker -->
                    <div class="absolute left-[5%] sm:left-[10%] md:left-[15%] top-[25%] sm:top-[30%] -rotate-12 bg-brand-green border-[3px] border-brand-black w-32 sm:w-40 py-1.5 px-1 shadow-sm transition-transform hover:rotate-[-5deg] cursor-pointer">
                        <div class="border-[2px] border-dashed border-brand-black w-full h-full flex flex-col items-center justify-center p-1">
                            <div class="flex items-center gap-1 mb-0.5">
                                <span class="text-[9px] sm:text-[11px] font-inter font-bold tracking-widest text-brand-black">RESERVE</span>
                                <span class="bg-brand-black text-brand-green rounded-full w-3.5 h-3.5 sm:w-4 sm:h-4 flex items-center justify-center text-[9px] sm:text-[11px] font-bold leading-none mb-[1px]">!</span>
                            </div>
                            <div class="font-caveat text-xl sm:text-2xl font-bold text-brand-black leading-none">Your Seat</div>
                        </div>
                    </div>

                    <!-- Center Yellow Button -->
                    <button class="bg-brand-yellow border-[4px] sm:border-[5px] border-brand-black rounded-full px-10 sm:px-16 py-3 sm:py-5 shadow-[0_8px_0_0_#1A1A1A] sm:shadow-[0_12px_0_0_#1A1A1A] hover:translate-y-1 hover:shadow-[0_4px_0_0_#1A1A1A] sm:hover:shadow-[0_8px_0_0_#1A1A1A] transition-all duration-200 active:translate-y-2 active:shadow-none group">
                        <span class="relative font-caveat text-3xl sm:text-5xl font-bold text-brand-black inline-block tracking-wide">
                            Book a Call
                            <!-- Hand-drawn underline SVG -->
                            <svg class="absolute -bottom-1 sm:-bottom-2 left-[5%] w-[90%] h-2 sm:h-3 group-hover:stroke-brand-black transition-colors" preserveAspectRatio="none" viewBox="0 0 100 10">
                                <path d="M0,5 Q50,9 100,2" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>

                    <!-- Right Blue Starburst Badge -->
                    <div class="absolute right-[5%] sm:right-[10%] md:right-[15%] top-[30%] sm:top-[35%] rotate-12 transition-transform hover:rotate-12 hover:scale-110 cursor-pointer">
                        <svg class="w-20 h-20 sm:w-28 sm:h-28 drop-shadow-sm" viewBox="0 0 100 100">
                            <path d="M50 0 L59 15 L75 5 L77 22 L93 15 L88 32 L100 38 L89 50 L100 62 L88 68 L93 85 L77 78 L75 95 L59 85 L50 100 L41 85 L25 95 L23 78 L7 85 L12 68 L0 62 L11 50 L0 38 L12 32 L7 15 L23 22 L25 5 L41 15 Z" fill="#2563EB" />
                            <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" class="font-caveat text-3xl sm:text-4xl font-bold fill-white" transform="rotate(-5, 50, 50)">Sale!</text>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Top Curtain (Moves Up) -->
            <div id="top-curtain" class="absolute top-0 left-0 w-full h-[50%] bg-brand-cream z-40">
                <!-- Top Wavy SVG Border (Hangs from the bottom of the top curtain) -->
                <svg class="absolute bottom-0 left-0 w-full h-[30px] sm:h-[40px] translate-y-[98%]" preserveAspectRatio="none">
                    <defs>
                        <pattern id="wave-top" width="120" height="40" patternUnits="userSpaceOnUse">
                            <!-- Cream fill -->
                            <path d="M 0 0 V 15 Q 30 40 60 15 T 120 15 V 0 Z" fill="#FDF8F0" />
                            <!-- Black stroke -->
                            <path d="M 0 15 Q 30 40 60 15 T 120 15" fill="none" stroke="#1A1A1A" stroke-width="3" />
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#wave-top)" />
                </svg>
            </div>

            <!-- Bottom Curtain (Moves Down) -->
            <div id="bottom-curtain" class="absolute bottom-0 left-0 w-full h-[50%] bg-brand-cream z-30">
                <!-- Bottom Wavy SVG Border (Sits on top of the bottom curtain) -->
                <svg class="absolute top-0 left-0 w-full h-[30px] sm:h-[40px] -translate-y-[98%]" preserveAspectRatio="none">
                    <defs>
                        <pattern id="wave-bottom" width="120" height="40" patternUnits="userSpaceOnUse">
                            <!-- Cream fill -->
                            <path d="M 0 40 V 25 Q 30 0 60 25 T 120 25 V 40 Z" fill="#FDF8F0" />
                            <!-- Black stroke -->
                            <path d="M 0 25 Q 30 0 60 25 T 120 25" fill="none" stroke="#1A1A1A" stroke-width="3" />
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#wave-bottom)" />
                </svg>
            </div>

        </div>

        <!-- Lower Text and Logo Section -->
        <div class="max-w-6xl mx-auto w-full px-6 sm:px-10 pb-16 relative z-50 bg-brand-cream">
            
            <!-- Right-aligned Middle Text -->
            <div class="flex justify-end mt-12 sm:mt-16 mb-16 sm:mb-24">
                <p class="w-full sm:w-3/4 md:w-[50%] lg:w-[45%] text-right font-inter font-bold text-brand-black text-sm sm:text-base leading-relaxed tracking-tight pr-2">
                    From Smashed Patties At Shake Shack To Glamburgers At Honky Tonk, There's A Little Something For Everyone.
                </p>
            </div>

            <!-- Bottom Row: Logo, Mascot, Socials -->
            <div class="flex flex-col md:flex-row items-center md:items-end justify-between gap-8 md:gap-0 relative">
                
                <!-- Logo & Mascot Container -->
                <div class="flex items-end relative">
                    <!-- Logo Text -->
                    <h1 class="font-bricolage text-6xl sm:text-8xl md:text-9xl font-extrabold tracking-tighter text-brand-black leading-none pb-2 relative z-10">
                        bitesized
                    </h1>
                    
                    <!-- SVG Mascot Character overlapping the text -->
                    <div class="absolute -right-12 sm:-right-16 md:-right-20 bottom-2 sm:bottom-4 z-20 w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 pointer-events-none">
                        <svg viewBox="0 0 100 100" fill="none" stroke="#1A1A1A" stroke-width="3" xmlns="http://www.w3.org/2000/svg">
                            <!-- Left Arm (Peace Sign) -->
                            <path d="M 30 45 Q 15 35 18 20" fill="none" stroke-linecap="round"/>
                            <circle cx="18" cy="20" r="4" fill="#FDF8F0"/>
                            <circle cx="13" cy="15" r="2.5" fill="#FDF8F0"/>
                            <circle cx="19" cy="12" r="2.5" fill="#FDF8F0"/>

                            <!-- Right Arm -->
                            <path d="M 70 50 Q 85 55 85 70" fill="none" stroke-linecap="round"/>
                            <path d="M 85 70 Q 92 75 88 80" fill="#FDF8F0" stroke-linecap="round"/>

                            <!-- Right Leg -->
                            <path d="M 60 70 L 68 85" fill="none" stroke-linecap="round"/>
                            <path d="M 62 85 Q 75 80 75 92 Q 62 95 62 85 Z" fill="#FDF8F0" stroke-linejoin="round"/>
                            <!-- Right Shoe Details -->
                            <path d="M 64 88 L 72 86 M 65 91 L 71 89" stroke-width="1.5" stroke-linecap="round"/>

                            <!-- Left Leg -->
                            <path d="M 40 70 L 35 85" fill="none" stroke-linecap="round"/>
                            <path d="M 38 85 Q 25 85 25 95 Q 38 98 40 85 Z" fill="#FDF8F0" stroke-linejoin="round"/>
                            <!-- Left Shoe Details -->
                            <path d="M 35 89 L 28 90 M 36 93 L 29 93" stroke-width="1.5" stroke-linecap="round"/>

                            <!-- Body -->
                            <circle cx="50" cy="48" r="24" fill="#FDF8F0"/>
                            <!-- Body Lines (Cookie/Burger texture) -->
                            <path d="M 35 35 Q 40 38 45 35 M 65 60 Q 60 55 55 58" stroke-width="1.5" stroke-linecap="round"/>

                            <!-- Hat -->
                            <path d="M 42 24 Q 50 12 58 24 Z" fill="#FDF8F0" stroke-linejoin="round"/>
                            <circle cx="50" cy="16" r="2.5" fill="#1A1A1A"/>
                            <path d="M 55 20 L 55 22" stroke-width="1.5" stroke-linecap="round"/>

                            <!-- Face -->
                            <path d="M 40 42 Q 43 39 46 42" fill="none" stroke-linecap="round"/> <!-- Wink -->
                            <circle cx="58" cy="42" r="2" fill="#1A1A1A"/> <!-- Eye -->
                            <path d="M 42 52 Q 50 62 58 52" fill="none" stroke-linecap="round"/> <!-- Smile -->
                            <path d="M 40 50 Q 42 54 44 51 M 56 51 Q 58 54 60 50" fill="none" stroke-width="1.5" stroke-linecap="round"/> <!-- Cheeks -->
                        </svg>
                    </div>
                </div>

                <!-- Social Icons -->
                <div class="flex items-center gap-5 pb-3">
                    <!-- X (Twitter) Icon -->
                    <a href="#" class="text-brand-black hover:text-brand-red transition-colors">
                        <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>
                        </svg>
                    </a>
                    <!-- Instagram Icon -->
                    <a href="#" class="text-brand-black hover:text-brand-red transition-colors">
                        <svg class="w-7 h-7 sm:w-9 sm:h-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- GSAP Animation Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin(ScrollTrigger);

            // Create a timeline linked to the scroll position of the zip section
            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: "#zip-section",
                    start: "top top", // Animation starts when the section hits the top of the viewport
                    end: "+=120%", // Pins the section for 120% of viewport height to give you time to scroll and unzip
                    scrub: 1, // Smooth scrubbing effect mapped directly to scroll velocity
                    pin: true, // This locks the section in place while the unzipping happens
                }
            });

            // 1. Pull the curtains apart to act like a zipper opening
            // Top curtain moves UP out of the container (leaving the wave hanging at the top)
            tl.to("#top-curtain", { yPercent: -100, ease: "none" }, 0)
              // Bottom curtain moves DOWN out of the container (leaving the wave sitting at the bottom)
              .to("#bottom-curtain", { yPercent: 100, ease: "none" }, 0)
              
            // 2. Parallax effect for the inner content
            // The content starts slightly scaled down and lower, then rises into place
              .fromTo("#parallax-content", 
                { y: "15%", scale: 0.9, opacity: 0 }, 
                { y: "0%", scale: 1, opacity: 1, ease: "power2.out" }, 
              0);
        });
    </script>
</body>
</html>
