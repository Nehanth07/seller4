<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Artists - Neon Border</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">

    <style>
        /* --- ROOT VARIABLES --- */
        :root {
            --color-black: #231E25;
            --color-white: #FFF;
            --color-brand-1: #FF55F8; /* Pink Color */
            --color-brand-2: #FF4337;
            --font-family-gellix: 'Gellix', 'Inter', sans-serif;
            
            /* Dimensions */
            --large-height: 5.2222rem; 
            --small-height: 3.8rem;
            
            /* Harmonic Button Config */
            --stripe-height: 6px;
            --btn-width: 180px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #111;
            font-family: var(--font-family-gellix);
            min-height: 200vh;
            display: flex; 
            flex-direction: column;
            align-items: center;
        }

        .hero-placeholder {
            margin-top: 30vh;
            color: white;
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            padding: 20px;
        }

        /* --- THE BAR CONTAINER --- */
        .s__bar {
            background-color: var(--color-white); 
            border-top: 1px solid var(--color-black);
            border-right: 1px solid var(--color-black);
            border-bottom: 0; 
            border-left: 0;

            display: flex; 
            align-items: stretch;
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 100;
            
            height: var(--large-height);
            transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- NEON LED --- */
        .s__bar::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: var(--color-brand-1);
            box-shadow: 0 0 10px var(--color-brand-1), 0 0 5px var(--color-brand-1);
            z-index: 101;
            pointer-events: none;
        }

        .s__bar.scrolled {
            height: var(--small-height);
        }

        /* --- SECTIONS --- */
        .section {
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-right: 1px solid var(--color-black); 
            height: 100%;
        }
        .section:last-child { border-right: none; }

        /* --- INFO SECTION --- */
        .info-sec {
            font-size: 1rem;
            line-height: 1.2;
            font-weight: 500;
            color: var(--color-black);
            white-space: nowrap;
            overflow: hidden;
            max-width: 400px;
            padding: 0 35px;
            opacity: 1;
            transition: 
                max-width 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                padding 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.5s ease-out;
        }

        .s__bar.scrolled .info-sec {
            max-width: 0;
            padding: 0;
            opacity: 0;
            border-right: 0px solid transparent; 
        }

        /* --- LOGO & BRAND --- */
        .logo-sec { 
            width: var(--large-height); 
            flex-shrink: 0; 
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .s__bar.scrolled .logo-sec { width: var(--small-height); }

        .logo-circle {
            width: 60%; height: 60%; border: 1px solid var(--color-black); border-radius: 50%;
            display: flex; flex-direction: column; position: relative; color: var(--color-black); font-weight: 400;
        }
        .logo-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background-color: var(--color-black); transform: translateY(-50%);
        }
        .logo-num { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.8em; line-height: 1; }
        
        .brand-sec { padding: 0 35px; font-weight: 800; font-size: 1.8rem; letter-spacing: -0.05em; color: var(--color-black); }
        .s__bar.scrolled .brand-sec { padding: 0 25px; transition: padding 0.6s ease; }

        /* --- LOGIN BUTTON --- */
        .login-sec { padding: 0 30px; }
        .btn-login {
            position: relative;
            background: transparent; 
            border: 1px solid var(--color-black);
            border-radius: 100px; 
            padding: 10px 25px; 
            font-size: 1rem; 
            color: var(--color-black); 
            text-decoration: none;
            overflow: hidden;
            z-index: 1;
            transition: color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-block;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 0;
            background-color: var(--color-black);
            z-index: -1;
            transform: translateY(-50%);
            transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-login:hover::before { height: 100%; }
        .btn-login:hover { color: var(--color-white); }

        /* --- HARMONIC CTA BUTTON --- */
        .cta-sec { padding: 0 25px; }

        .btn-container {
            position: relative;
            width: var(--btn-width);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .s__bar.scrolled .btn-container { transform: scale(0.88); }

        .stripe {
            background-color: var(--color-brand-1);
            height: var(--stripe-height);
            display: block;
            transform-origin: center;
            will-change: transform;
            transform: scaleX(1);
            margin-top: -1px;
            /* REVERSE LOGIC: Elastic Back-Out Cubic Bezier */
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Staggered Track Back Delay */
        .s1, .s8 { transition-delay: 0.15s; }
        .s2, .s7 { transition-delay: 0.10s; }
        .s3, .s6 { transition-delay: 0.05s; }
        .s4, .s5 { transition-delay: 0.00s; }

        .s1 { margin-top: 0; }
        .s1, .s8 { width: 90%; } 
        .s2, .s7 { width: 96%; }
        .s3, .s4, .s5, .s6 { width: 100%; }

        .btn-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            color: var(--color-black);
            font-weight: 800;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Animations */
        @keyframes beat-bass {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(1.18); }
        }
        @keyframes beat-snare {
            0%, 100% { transform: scaleX(1); }
            20% { transform: scaleX(1.08); }
            40% { transform: scaleX(0.95); }
            60% { transform: scaleX(1.03); }
        }
        @keyframes beat-jitter {
            0%, 100% { transform: scaleX(1); }
            25% { transform: scaleX(1.05); }
            75% { transform: scaleX(0.97); }
        }

        .btn-container:hover .stripe {
            /* On hover, reset all delays instantly so they react immediately */
            transition: transform 0.2s ease-out;
            transition-delay: 0s !important;
        }

        .btn-container:hover .s1 { animation: beat-jitter 0.4s infinite linear; }
        .btn-container:hover .s2 { animation: beat-snare 0.6s infinite cubic-bezier(0.2, 0.8, 0.2, 1); animation-delay: 0.05s; }
        .btn-container:hover .s3 { animation: beat-bass 0.8s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-container:hover .s4 { animation: beat-jitter 0.35s infinite linear; animation-delay: 0.1s; }
        .btn-container:hover .s5 { animation: beat-bass 0.7s infinite cubic-bezier(0.4, 0, 0.2, 1); animation-delay: 0.15s; }
        .btn-container:hover .s6 { animation: beat-snare 0.5s infinite cubic-bezier(0.2, 0.8, 0.2, 1); animation-delay: 0.2s; }
        .btn-container:hover .s7 { animation: beat-jitter 0.45s infinite linear; animation-delay: 0.1s; }
        .btn-container:hover .s8 { animation: beat-snare 0.65s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }

        .btn-container:active {
            transform: scale(0.94);
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="hero-placeholder">Scroll Down<br>for Animation</div>

    <div class="s__bar" id="navbar">
        <div class="section logo-sec">
            <div class="logo-circle">
                <div class="logo-num">24</div>
                <div class="logo-line"></div>
                <div class="logo-num">7</div>
            </div>
        </div>

        <div class="section brand-sec">24/7Artists</div>

        <div class="section info-sec">
            A personalized music career<br>plan for independent artists.
        </div>

        <div class="section login-sec">
            <a href="#" class="btn-login">Login</a>
        </div>

        <div class="section cta-sec">
            <a href="#" class="btn-container">
                <span class="btn-text">Create Account</span>
                <span class="stripe s1"></span>
                <span class="stripe s2"></span>
                <span class="stripe s3"></span>
                <span class="stripe s4"></span>
                <span class="stripe s5"></span>
                <span class="stripe s6"></span>
                <span class="stripe s7"></span>
                <span class="stripe s8"></span>
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
