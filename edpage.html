<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Help Artists Grow</title>
    <style>
        :root {
            --color-brand-11: #bdf740; /* Lime green background */
            --color-black: #111111;
            --color-white: #ffffff;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-brand-11);
            color: var(--color-black);
            font-family: var(--font-sans);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* --- Top Hamburger Menu --- */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--color-white);
            border: 1px solid var(--color-black);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 30px;
            height: 2px;
            background: var(--color-black);
        }

        /* --- Bottom Navigation Bar --- */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            background: var(--color-white);
            border-top: 1px solid var(--color-black);
            border-right: 1px solid var(--color-black);
            display: flex;
            align-items: stretch;
            z-index: 1000;
            height: 60px;
        }
        .bb-item {
            border-right: 1px solid var(--color-black);
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bb-item:last-child {
            border-right: none;
        }
        .bb-logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }
        
        .bb-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--color-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            line-height: 1.1;
        }
        .bb-circle hr {
            width: 100%;
            border: none;
            border-top: 1px solid var(--color-black);
            margin: 1px 0;
        }
        
        .btn-login {
            border: 1px solid var(--color-black);
            border-radius: 30px;
            padding: 6px 20px;
            text-decoration: none;
            color: var(--color-black);
            font-size: 0.9rem;
        }
        
        .btn-create-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .btn-create {
            background: #ff47ff;
            border: none;
            padding: 8px 18px;
            color: var(--color-black);
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            position: relative;
            z-index: 2;
        }
        .btn-create::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px dotted var(--color-black);
            transform: translate(5px, 5px);
            z-index: -1;
        }

        /* --- STICKY FOLLOW LAYOUT --- */
        .s-education-home {
            position: relative;
            height: 450vh; /* Track for centered experience */
            overflow: visible; 
            z-index: 10;
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .parallax-text-group {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            will-change: transform;
        }

        .center-line {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1px;
            height: 1px;
            z-index: 1;
        }
        .center-line::before, .center-line::after {
            content: '';
            position: absolute;
            left: 0;
            width: 1px;
            height: 200vh;
            background: var(--color-black);
        }
        .center-line::before { bottom: 150px; }
        .center-line::after { top: 170px; }

        .s__content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .s_suptitle {
            display: inline-block;
            border: 1px solid var(--color-black);
            border-radius: 50px;
            padding: 4px 20px;
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 20px;
            background: var(--color-white);
        }

        .s_title {
            font-size: clamp(4rem, 8vw, 7.5rem);
            line-height: 0.85;
            font-weight: 500;
            letter-spacing: -0.05em;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .s__text {
            font-size: 1.15rem;
            line-height: 1.4;
            max-width: 500px;
            padding: 10px 0;
        }
        .s__text a {
            color: var(--color-black);
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 4px;
        }

        /* --- Floating Courses Cards --- */
        .s__courses {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; 
            overflow: visible;
        }
        .s_courses_list {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .sb-course {
            position: absolute;
            border: 1px solid var(--color-black);
            padding: 12px 18px;
            font-size: 1.1rem;
            white-space: nowrap;
            background: transparent;
            list-style: none;
            line-height: 1.2;
            pointer-events: auto; 
            transform-origin: center center;
            will-change: transform;
        }

        .sb-course--title {
            background: var(--color-black);
            color: var(--color-brand-11);
            font-size: 2.2rem;
            padding: 15px 25px;
            font-weight: 500;
            border: none;
            letter-spacing: -0.02em;
        }

        .section-spacer {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            position: relative;
            z-index: 5;
        }

        @media (max-width: 768px) {
            .bottom-bar { display: none; }
            .menu-btn { top: 10px; right: 10px; width: 50px; height: 50px; }
            .s__courses { opacity: 0.4; } 
        }
    </style>
</head>
<body>

    <button class="menu-btn" aria-label="Menu">
        <span></span>
        <span></span>
    </button>

    <div class="bottom-bar">
        <div class="bb-item" style="padding: 0 15px;">
            <div class="bb-circle"><span>24</span><hr><span>7</span></div>
        </div>
        <div class="bb-item bb-logo">24/7Artists</div>
        <div class="bb-item"><a href="#" class="btn-login">Login</a></div>
        <div class="bb-item">
            <div class="btn-create-wrapper"><a href="#" class="btn-create">Create Account</a></div>
        </div>
    </div>

    <!-- Top Section -->
    <div class="section-spacer" style="background: var(--color-white); color: var(--color-black);">
        <h2>Scroll Down</h2>
        <p style="font-size: 1.2rem; font-weight: normal; margin-top: 20px;">The container slides smoothly in the center.</p>
    </div>

    <!-- MAIN SPRING TRACK -->
    <div class="s-education-home" id="education">
        <div class="sticky-wrapper">
            
            <div class="parallax-text-group js-spring-group">
                <div class="center-line"></div>
                <div class="s__content">
                    <div class="s_suptitle">Education</div>
                    <h1 class="s_title">We help<br>artists grow</h1>
                    <p class="s__text">
                        Access expert-led <a href="https://learn.247artists.com/">online courses</a>, live webinars, and mentorship programs designed to sharpen your skills.
                    </p>
                </div>
            </div>

            <div class="s__courses">
                <ul class="s_courses_list" id="coursesList"></ul>
            </div>
        </div>
    </div>

    <div class="section-spacer" style="background: var(--color-black); color: var(--color-brand-11);">
        <h2>Keep Exploring</h2>
    </div>

    <script>
        const cardsData = [
            { text: "Intro to Artist<br>Management", top: "10%", left: "8%", rot: "-25deg", speedY: 0.45 },
            { text: "5 Tips<br>Artists Going<br>On Tour", top: "4%", left: "20%", rot: "-12deg", speedY: 0.15 },
            { text: "The art of<br>Vision Boarding", top: "18%", left: "26%", rot: "-6deg", speedY: 0.55 },
            { text: "Marketing for<br>Artists", top: "22%", left: "72%", rot: "5deg", speedY: 0.25 },
            { text: "Starting an<br>indie record<br>label", top: "35%", left: "80%", rot: "125deg", speedY: 0.65 },
            { text: "Creating a<br>One Year Indie<br>Music Plan", top: "48%", left: "6%", rot: "-20deg", speedY: 0.35 },
            { text: "Music<br>Marketing and<br>Promotion", top: "48%", left: "18%", rot: "-12deg", speedY: 0.5 },
            { text: "How to<br>Manage<br>Yourself", top: "68%", left: "16%", rot: "35deg", speedY: 0.2 },
            { text: "Copyright and IP", top: "78%", left: "2%", rot: "-30deg", speedY: 0.6 },
            { text: "Music Business<br>Intro", top: "58%", left: "68%", rot: "-12deg", speedY: 0.1 },
            { text: "Tour Management", top: "50%", left: "86%", rot: "-18deg", speedY: 0.4 },
            { text: "Music Publishing", top: "82%", left: "60%", rot: "-55deg", speedY: 0.3 },
            { text: "Artist Career Path", top: "90%", left: "66%", rot: "-45deg", speedY: 0.5 },
            { text: "Building a team", top: "88%", left: "76%", rot: "25deg", speedY: 0.25 },
            { text: "Brand Identity", top: "28%", left: "30%", rot: "4deg", zIndex: 1, speedY: 0.35 }, 
            { text: "20+<br>Courses", top: "12%", left: "58%", rot: "25deg", isTitle: true, speedY: 0.15 }
        ];

        const listContainer = document.getElementById('coursesList');
        const parallaxElements = []; 

        cardsData.forEach(card => {
            const li = document.createElement('li');
            if (card.isTitle) li.className = 'sb-course sb-course--title';
            else li.className = 'sb-course';

            li.style.top = card.top;
            li.style.left = card.left;
            if (card.zIndex) li.style.zIndex = card.zIndex;
            li.innerHTML = `<span>${card.text}</span>`;
            listContainer.appendChild(li);

            const rand = Math.random();
            let floatSpeed;
            // Updated ratios: 30% Slow, 50% Medium, 20% Fast
            if (rand < 0.3) {
                // 30% Slow speeds
                floatSpeed = 0.015 + Math.random() * 0.02;
            } else if (rand < 0.8) {
                // 50% Medium speeds
                floatSpeed = 0.04 + Math.random() * 0.04;
            } else {
                // 20% Fast speeds
                floatSpeed = 0.12 + Math.random() * 0.15;
            }

            parallaxElements.push({
                element: li,
                rot: parseFloat(card.rot) || 0,
                currentRot: parseFloat(card.rot) || 0, 
                baseRotSpeed: (Math.random() > 0.5 ? 1 : -1) * (0.75 - card.speedY) * 0.07, 
                speedY: card.speedY,
                topPercent: parseFloat(card.top),
                floatSpeed: floatSpeed, 
                ambientDistance: 0
            });
        });

        /**
         * PHYSICS ENGINE
         */
        let targetScrollY = window.scrollY;
        let springY = window.scrollY; 
        let springVelocity = 0;
        
        const stiffness = 0.06;
        const damping = 0.58;
        const mass = 1.0;             
        const lagIntensity = 0.35;

        let smoothedLag = 0;

        const springGroup = document.querySelector('.js-spring-group');
        const educationSection = document.getElementById('education');

        window.addEventListener('scroll', () => {
            targetScrollY = window.scrollY;
        }, { passive: true });

        let lastTime = null;
        let lastScrollDirection = 1;

        function animate(time) {
            if (!lastTime) lastTime = time;
            const deltaTime = time - lastTime;
            lastTime = time;

            const displacement = targetScrollY - springY;
            const springForce = displacement * stiffness;
            const prevSpringY = springY;
            
            springVelocity = (springVelocity + springForce / mass) * damping;
            springY += springVelocity;

            if (Math.abs(springY - prevSpringY) > 0.1) {
                lastScrollDirection = Math.sign(springY - prevSpringY);
            }

            const H = window.innerHeight;
            const sectionTop = educationSection.offsetTop;
            
            const rawLag = targetScrollY - springY;
            smoothedLag += (rawLag - smoothedLag) * 0.15; 

            if (springGroup) {
                const offsetY = -(smoothedLag * lagIntensity);
                springGroup.style.transform = `translate3d(0, ${offsetY}px, 0)`;
            }

            const minY = -500; 
            const maxY = H + 500;
            const wrapRange = maxY - minY;
            const relativeSpringY = springY - sectionTop;

            parallaxElements.forEach(item => {
                item.ambientDistance += item.floatSpeed * deltaTime * lastScrollDirection;
                const startY = (item.topPercent / 100) * H;
                const distanceMoved = (relativeSpringY * item.speedY * 2.5) + item.ambientDistance;
                const absY = startY - distanceMoved;
                const wrappedAbsY = ((absY - minY) % wrapRange + wrapRange) % wrapRange + minY;
                const translateY = wrappedAbsY - startY;

                item.currentRot += (item.baseRotSpeed * lastScrollDirection) * deltaTime;
                item.element.style.transform = `translate3d(0, ${translateY}px, 0) rotate(${item.currentRot}deg)`;
            });

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
