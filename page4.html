<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Market Cards</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap');

    /* Final locked animation speeds */
    :root {
        --bump-duration: 1.1s;
        --flip-delay: 1.5s;
    }

    body {
        background-color: #0f1923; /* Valorant dark background */
        color: white;
        font-family: 'Roboto', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
    }

    h1 {
        font-family: 'Anton', sans-serif;
        font-size: 3rem;
        letter-spacing: 2px;
        color: #ece8e1;
        margin-bottom: 50px;
    }

    h1 span {
        color: #ff4655; /* Valorant Red */
    }

    .card-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px;
    }

    /* 3D Scene setup for the flip */
    .card {
        width: 220px;
        height: 340px;
        perspective: 1000px;
        cursor: pointer;
        /* Define the neon color variable per card */
        --neon-color: #ff4655; /* Default Pink/Red */
    }

    .card.gold { --neon-color: #e5c56d; }
    .card.blue { --neon-color: #00e5ff; }

    .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.2s ease-out; /* For hover */
        /* Hardware acceleration for smoother 3D flip */
        will-change: transform; 
    }

    /* Hover effect before clicking */
    .card:not(.flipped):hover .card-inner {
        transform: scale(1.05);
    }

    /* Flipped state (Added delay so opening animation plays first) */
    .card.flipped .card-inner {
        transform: rotateY(180deg) scale(1);
        transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) var(--flip-delay);
    }

    .card-front, .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border: 2px solid;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    /* --- FRONT OF CARD --- */
    .card-front {
        background: #1b2531;
        border: none; 
    }

    /* SVG overlay covering the entire front */
    .card-front svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /* --- BACK OF CARD (Revealed) --- */
    .card-back {
        background: radial-gradient(circle, #ff4655 0%, #a32c36 100%);
        transform: rotateY(180deg);
        border-color: #ff4655;
        box-shadow: 0 0 25px rgba(255, 70, 85, 0.6);
        justify-content: space-between;
        padding: 15px;
    }

    /* Different rarity colors */
    .card.gold .card-back { 
        background: radial-gradient(circle, #e5c56d 0%, #998348 100%);
        border-color: #e5c56d;
        box-shadow: 0 0 25px rgba(229, 197, 109, 0.6);
    }

    .card.blue .card-back { 
        background: radial-gradient(circle, #00e5ff 0%, #008999 100%);
        border-color: #00e5ff;
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
    }

    /* Text & Info on the back */
    .card-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        font-size: 1.1rem;
    }

    .discount {
        background: rgba(0, 0, 0, 0.5);
        padding: 2px 6px;
        border-radius: 4px;
        color: #00ff66; /* Green discount text */
    }

    .price {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .vp-icon {
        width: 12px;
        height: 12px;
        background: #fff;
        border-radius: 50%;
        display: inline-block;
    }

    .weapon-name {
        font-family: 'Anton', sans-serif;
        font-size: 1.8rem;
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* Flash animation when clicked */
    @keyframes flash {
        0% { filter: brightness(1); }
        50% { filter: brightness(3); }
        100% { filter: brightness(1); }
    }

    .card.flipped .card-inner {
        animation: flash 0.5s ease-out var(--flip-delay);
    }

    /* Custom line base transitions */
    .card-front svg .line {
        transition: all 0.3s ease;
    }

    /* Transform origins for specific geometry */
    .card-front svg .anim-bump.top { transform-origin: 110px 5px; }
    .card-front svg .anim-bump.bottom { transform-origin: 110px 335px; }
    
    .card-front svg .anim-2,
    .card-front svg .anim-3 {
        transform-origin: 110px 150px; 
    }

    /* 3. Lines contract inwards from the outside edges towards the center triangle */
    .card-front svg .anim-4 {
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
    }
    .card.flipped .card-front svg .anim-4 {
        animation: eraseLine 0.4s ease-in forwards;
    }
    @keyframes eraseLine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
    }

    /* 4. Center Triangles collapse into themselves */
    .card.flipped .card-front svg .anim-2,
    .card.flipped .card-front svg .anim-3 {
        animation: collapseTriangle 0.3s ease-in forwards 0.4s;
    }
    @keyframes collapseTriangle {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0); opacity: 0; }
    }

    /* 
      ======================================================
      OPTIMIZED NEON BURST ANIMATION
      ======================================================
    */
    .card-front svg .anim-bump {
        /* GPU acceleration hint ensures the drop-shadow repaints smoothly */
        will-change: transform, opacity, filter;
    }

    .card.flipped .card-front svg .anim-bump {
        /* Removed global cubic-bezier so internal keyframe timings apply correctly */
        animation: bumpNeon var(--bump-duration) forwards 0.7s;
    }
    
    @keyframes bumpNeon {
        /* PHASE 1: Start Normal */
        0% { 
            transform: scaleX(1);    
            fill: #ffffff; 
            filter: drop-shadow(0 0 0 transparent); 
            opacity: 1; 
            /* Squeeze in quickly */
            animation-timing-function: cubic-bezier(0.5, 0, 1, 0.5); 
        }
        /* PHASE 2: Squeezed tightly inward */
        25% { 
            transform: scaleX(0.02); 
            fill: #ffffff; 
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.8)); 
            opacity: 1; 
            /* Explode outward rapidly, then glide to a smooth stop */
            animation-timing-function: cubic-bezier(0.1, 0.9, 0.2, 1); 
        }
        /* PHASE 3: Snap to full neon color */
        55% {
            transform: scaleX(2.8);
            fill: var(--neon-color);
            filter: drop-shadow(0 0 14px var(--neon-color));
            opacity: 1;
        }
        /* PHASE 4: Hold the vivid neon glow */
        80% {
            transform: scaleX(3.9);
            fill: var(--neon-color);
            filter: drop-shadow(0 0 22px var(--neon-color));
            opacity: 1;
        }
        /* PHASE 5: Fade out while still fully neon */
        100% { 
            transform: scaleX(4.5);  
            fill: var(--neon-color); 
            filter: drop-shadow(0 0 30px var(--neon-color)); 
            opacity: 0; 
        }
    }

    /* Card Entrance Animation (Dealing the cards) */
    .card {
        opacity: 0;
        transform: translateY(50px) rotate(-5deg);
        animation: dealCard 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes dealCard {
        to {
            opacity: 1;
            transform: translateY(0) rotate(0deg);
        }
    }

    /* Staggered entrance delays */
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }
    .card:nth-child(5) { animation-delay: 0.5s; }
    .card:nth-child(6) { animation-delay: 0.6s; }

</style>
</head>
<body>
    <h1>NIGHT.<span>MARKET</span></h1>

    <div class="card-container" id="market-container">
        <!-- Cards will be injected here via JavaScript -->
    </div>

    <!-- 
      ======================================================
      SVG TEMPLATE FOR CARD FRONT
      ======================================================
    -->
    <template id="card-design-template">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 340">
            <!-- BACKGROUND GRID -->
            <defs>
                <pattern id="grid-pattern" width="44" height="76.2" patternUnits="userSpaceOnUse">
                    <path d="M0,38.1 L22,0 L44,38.1 L22,76.2 Z" fill="none" stroke="#2d3c50" stroke-width="1" />
                    <path d="M-22,38.1 L0,0 L22,38.1 L0,76.2 Z" fill="none" stroke="#2d3c50" stroke-width="1" />
                    <path d="M22,38.1 L44,0 L66,38.1 L44,76.2 Z" fill="none" stroke="#2d3c50" stroke-width="1" />
                    <line x1="22" y1="0" x2="22" y2="76.2" stroke="#2d3c50" stroke-width="1" />
                    <line x1="0" y1="0" x2="0" y2="76.2" stroke="#2d3c50" stroke-width="1" />
                </pattern>
            </defs>
            <!-- Grid background sized to match the border exactly (x5 y5, 210 x 330) -->
            <rect x="5" y="5" width="210" height="330" fill="url(#grid-pattern)" />

            <!-- Corner Dark Overlays -->
            <polygon points="0,65 0,135 33,100" fill="rgba(0,0,0,0.2)" />
            <polygon points="220,65 220,135 187,100" fill="rgba(0,0,0,0.2)" />
            <polygon points="0,205 0,275 33,240" fill="rgba(0,0,0,0.2)" />
            <polygon points="220,205 220,275 187,240" fill="rgba(0,0,0,0.2)" />
            <polygon points="0,0 22,0 0,35" fill="rgba(0,0,0,0.2)" />
            <polygon points="220,0 198,0 220,35" fill="rgba(0,0,0,0.2)" />
            <polygon points="0,340 22,340 0,305" fill="rgba(0,0,0,0.2)" />
            <polygon points="220,340 198,340 220,305" fill="rgba(0,0,0,0.2)" />

            <!-- Complete thin border (enlarged to align with the card edges) -->
            <rect class="line" x="1" y="1" width="218" height="338" fill="none" stroke="#ffffff" stroke-width="1" />

            <!-- Top and Bottom Bold Blocks (with neon burst animation) -->
            <rect class="line anim-bump top" x="75" y="2" width="70" height="6" fill="#ffffff" />
            <rect class="line anim-bump bottom" x="75" y="332" width="70" height="6" fill="#ffffff" />

            <!-- Main Outer Triangle (Number 2) -->
            <polygon class="line anim-2" data-number="2" stroke-width="3" points="60,115 160,115 110,200" fill="none" stroke="#ffffff" />

            <!-- Inner Small Triangle (Number 3) -->
            <polygon class="line anim-3" data-number="3" stroke-width="2" points="85,157.5 135,157.5 110,115" fill="none" stroke="#ffffff" />

            <!-- Bottom Vertical Line - Thin (Number 4) -->
            <line class="line anim-4" data-number="4" stroke-width="1.5" pathLength="100" x1="110" y1="200" x2="110" y2="305" stroke="#ffffff" />
            <!-- Bottom Vertical Line - Thick (Number 4) -->
            <line class="line anim-4" data-number="4" stroke-width="4" pathLength="100" x1="110" y1="290" x2="110" y2="305" stroke="#ffffff" />

            <!-- Top Left Diagonal - Thin (Number 4) -->
            <line class="line anim-4" data-number="4" stroke-width="1.5" pathLength="100" x1="85" y1="157.5" x2="25" y2="75" stroke="#ffffff" />
            <!-- Top Left Diagonal - Thick (Number 4) -->
            <line class="line anim-4" data-number="4" stroke-width="4" pathLength="100" x1="36" y1="90" x2="25" y2="75" stroke="#ffffff" />

            <!-- Top Right Diagonal - Thin (Number 4) -->
            <line class="line anim-4" data-number="4" stroke-width="1.5" pathLength="100" x1="135" y1="157.5" x2="195" y2="75" stroke="#ffffff" />
            <!-- Top Right Diagonal - Thick (Number 4) -->
            <line class="line anim-4" data-number="4" stroke-width="4" pathLength="100" x1="184" y1="90" x2="195" y2="75" stroke="#ffffff" />
        </svg>
    </template>

    <script>
        const cardData = [
            { rarity: '', discount: '-40%', price: '1,065', weapon: 'Ion Ares' },
            { rarity: 'gold', discount: '-19%', price: '1,438', weapon: 'Sovereign Odin' },
            { rarity: 'blue', discount: '-28%', price: '1,836', weapon: 'Altitude Knife' },
            { rarity: '', discount: '-33%', price: '1,185', weapon: 'Reaver Vandal' },
            { rarity: 'gold', discount: '-21%', price: '1,399', weapon: 'Forsaken Classic' },
            { rarity: 'blue', discount: '-45%', price: '875', weapon: 'Smite Phantom' },
        ];

        const container = document.getElementById('market-container');
        const svgTemplate = document.getElementById('card-design-template').innerHTML;

        // Build all cards in a fragment first, then append once (fewer reflows)
        const fragment = document.createDocumentFragment();

        cardData.forEach(data => {
            const card = document.createElement('div');
            card.className = `card ${data.rarity}`.trim();
            card.addEventListener('click', () => flipCard(card));

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        ${svgTemplate}
                    </div>
                    <div class="card-back">
                        <div class="card-header">
                            <span class="discount">${data.discount}</span>
                            <span class="price"><span class="vp-icon"></span> ${data.price}</span>
                        </div>
                        <div class="weapon-name">${data.weapon}</div>
                    </div>
                </div>
            `;
            fragment.appendChild(card);
        });

        container.appendChild(fragment);

        function flipCard(cardElement) {
            // Prevent re-triggering if already flipped
            if (cardElement.classList.contains('flipped')) return;

            const inner = cardElement.querySelector('.card-inner');

            // Coin-flick feel: a random number of spins (more than one or two,
            // but never too many) at a random speed that decelerates to a stop.
            const extraSpins = 1 + Math.floor(Math.random() * 3);      // 1, 2 or 3 full spins
            const degrees = 180 + 360 * extraSpins;                    // odd half-turn = always lands on the back
            const duration = (0.9 + Math.random() * 0.9).toFixed(2);   // 0.9s - 1.8s, random speed

            // Deceleration easing so it slows down and settles like a flicked coin.
            inner.style.transition =
                `transform ${duration}s cubic-bezier(0.15, 0.9, 0.2, 1) var(--flip-delay)`;
            inner.style.transform = `rotateY(${degrees}deg)`;

            cardElement.classList.add('flipped');
        }
    </script>
</body>
</html>
