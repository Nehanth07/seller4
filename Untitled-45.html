<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            background: #050a0f; /* Dark space-like background */
            overflow: hidden;
            cursor: none; /* Hide the default cursor */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="cometCanvas"></canvas>

<script>
const canvas = document.getElementById('cometCanvas');
const ctx = canvas.getContext('2d');

let mouse = { x: 0, y: 0, lastX: 0, lastY: 0, speed: 0 };
let particles = [];

// Handle resizing
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Track Mouse and Velocity
window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    // Calculate speed (Pythagorean theorem)
    const dx = mouse.x - mouse.lastX;
    const dy = mouse.y - mouse.lastY;
    mouse.speed = Math.sqrt(dx * dx + dy * dy);

    mouse.lastX = mouse.x;
    mouse.lastY = mouse.y;
});

class TailParticle {
    constructor(x, y, speedX, speedY) {
        this.x = x;
        this.y = y;
        // The tail moves slightly in the opposite direction of the mouse
        this.vx = (Math.random() - 0.5) * 2 - (speedX * 0.1);
        this.vy = (Math.random() - 0.5) * 2 - (speedY * 0.1);
        
        this.alpha = 1;
        // Faster movement = longer living particles (longer tail)
        this.decay = Math.random() * 0.01 + 0.015; 
        this.size = Math.random() * 20 + 10;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        if (this.size > 0.5) this.size -= 0.3;
    }

    draw() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter'; // Glow effect
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        // Gradient color: Blue to Cyan (comet colors)
        ctx.fillStyle = `rgba(0, 150, 255, ${this.alpha})`;
        ctx.fill();
        ctx.restore();
    }
}

function animate() {
    // Semi-transparent clear creates a slight motion blur "ghosting" effect
    ctx.fillStyle = 'rgba(5, 10, 15, 0.2)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. Generate tail particles based on speed
    // The faster we move, the more particles we drop
    let flow = Math.min(mouse.speed, 20); 
    for (let i = 0; i < flow; i++) {
        const dx = mouse.x - mouse.lastX;
        const dy = mouse.y - mouse.lastY;
        particles.push(new TailParticle(mouse.x, mouse.y, dx, dy));
    }

    // 2. Update and Draw Tail
    particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(index, 1);
    });

    // 3. Draw Comet Head (2cm radius dot)
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 38, 0, Math.PI * 2); // ~75px diameter
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#00ffff';
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
