<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staggered Simultaneous Transition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #f0f0f0; }

        .spacer {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #888;
        }

        /* The viewport for the animation */
        .transition-wrapper {
            position: relative;
            height: 200vh; /* Scroll length */
        }

        .sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* The Strips */
        .strip {
            position: absolute;
            left: 0;
            width: 100%;
            height: 33.5%; /* Overlap slightly to prevent gaps */
            background-color: #000;
            /* Every strip starts at the same "floor" far below the screen */
            transform: translateY(100vh); 
            will-change: transform;
        }

        /* Correct placement for when they reach 0% */
        #strip-1 { top: 0; }
        #strip-2 { top: 33.33%; }
        #strip-3 { top: 66.66%; }

        .faq-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            opacity: 0;
        }

        .faq-text {
            font-size: 8vw;
            font-weight: 800;
            color: transparent;
            -webkit-text-stroke: 1px white;
            letter-spacing: 0.2em;
        }

        .sub-text {
            color: white;
            margin-top: 10px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div class="spacer">Scroll down to see simultaneous strips</div>

    <div class="transition-wrapper">
        <div class="sticky-container">
            <div class="strip" id="strip-1"></div>
            <div class="strip" id="strip-2"></div>
            <div class="strip" id="strip-3"></div>

            <div class="faq-box">
                <div class="faq-text">FAQ</div>
                <div class="sub-text">制作に関するよくある質問</div>
            </div>
        </div>
    </div>

    <div class="spacer" style="background-color: black;">End of Page</div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".transition-wrapper",
                start: "top top",
                end: "bottom bottom",
                scrub: 1,
                pin: true
            }
        });

        // ANIMATION LOGIC
        tl.to(".strip", {
            y: 0, // All moving to their CSS 'top' position
            duration: 2,
            // STAGGER: This is the magic. 
            // amount: 0.3 means the total time between the first and last strip starting is only 0.3s.
            // This makes them start almost at the same time but stay offset.
            stagger: {
                amount: 0.4, 
                ease: "power1.out"
            },
            ease: "power2.inOut"
        })
        .to(".faq-box", {
            opacity: 1,
            duration: 0.5,
            ease: "power2.out"
        }, "-=0.5"); // Starts appearing just as the last strip is finishing
    </script>
</body>
</html>
