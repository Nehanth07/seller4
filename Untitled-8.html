<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Artists - Neon Border</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">

    <style>
        /* --- ROOT VARIABLES --- */
        :root {
            --color-black: #231E25;
            --color-white: #FFF;
            --color-brand-1: #FF55F8; /* Pink Color */
            --color-brand-2: #FF4337;
            --font-family-gellix: 'Gellix', 'Inter', sans-serif;
            
            /* Dimensions */
            --large-height: 5.2222rem; 
            --small-height: 3.8rem;
            
            /* Button Specifics */
            --btn-fs: 1.2777rem;
            --btn-padding: .3913em .6em .4413em;
            --btn-spacing: -0.06em;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #111;
            font-family: var(--font-family-gellix);
            min-height: 200vh;
            display: flex; 
            flex-direction: column;
            align-items: center;
        }

        .hero-placeholder {
            margin-top: 30vh;
            color: white;
            text-align: center;
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
        }

        /* --- THE BAR CONTAINER --- */
        .s__bar {
            background-color: var(--color-white); 
            
            /* Borders */
            border-top: 1px solid var(--color-black);
            border-right: 1px solid var(--color-black);
            border-bottom: 0; 
            border-left: 0;

            display: flex; 
            align-items: stretch;
            
            /* Fixed Bottom Left */
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 100;
            
            height: var(--large-height);
            transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- NEW CODE: THE NEON LED --- */
        /* This pseudo-element creates the glowing line on the right */
        .s__bar::after {
            content: '';
            position: absolute;
            right: -2px; /* Pull it slightly over the border */
            top: 0;
            width: 4px;  /* Thickness of the LED */
            height: 100%;
            background-color: var(--color-brand-1);
            /* The Glow Effect */
            box-shadow: 0 0 10px var(--color-brand-1), 0 0 5px var(--color-brand-1);
            z-index: 101;
            pointer-events: none;
        }

        /* --- SCROLLED STATE --- */
        .s__bar.scrolled {
            height: var(--small-height);
        }

        /* --- SECTIONS --- */
        .section {
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-right: 1px solid var(--color-black); 
            height: 100%;
        }
        .section:last-child { border-right: none; }

        /* --- INFO SECTION --- */
        .info-sec {
            font-size: 1rem;
            line-height: 1.2;
            font-weight: 500;
            color: var(--color-black);
            white-space: nowrap;
            overflow: hidden;
            max-width: 400px;
            padding: 0 35px;
            opacity: 1;
            transition: 
                max-width 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                padding 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.5s ease-out;
        }

        .s__bar.scrolled .info-sec {
            max-width: 0;
            padding: 0;
            opacity: 0;
            border-right: 0px solid transparent; 
        }

        /* --- LOGO & BRAND --- */
        .logo-sec { 
            width: var(--large-height); 
            flex-shrink: 0; 
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .s__bar.scrolled .logo-sec { width: var(--small-height); }

        .logo-circle {
            width: 65%; height: 65%; border: 1px solid var(--color-black); border-radius: 50%;
            display: flex; flex-direction: column; position: relative; color: var(--color-black); font-weight: 400;
        }
        .logo-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background-color: var(--color-black); transform: translateY(-50%);
        }
        .logo-num { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.9em; line-height: 1; }
        .logo-num.top { padding-top: 2px; } .logo-num.bottom { padding-bottom: 2px; }
        
        .brand-sec { padding: 0 35px; font-weight: 800; font-size: 2rem; letter-spacing: -0.05em; color: var(--color-black); }
        .s__bar.scrolled .brand-sec { padding: 0 25px; transition: padding 0.6s ease; }

        /* Login Button */
        .login-sec { padding: 0 30px; }
        .btn-login {
            font-family: var(--font-family-gellix); background: transparent; border: 1px solid var(--color-black);
            border-radius: 100px; padding: 10px 30px; font-size: 1.1rem; color: var(--color-black); text-decoration: none;
            transition: all 0.3s ease;
        }

        /* --- CTA BUTTON --- */
        .cta-sec { padding: 0 25px; }

        .btn-cta {
            position: relative; display: inline-block; padding: var(--btn-padding);
            font-size: var(--btn-fs); font-weight: 500; letter-spacing: var(--btn-spacing);
            color: var(--color-black); text-decoration: none; border: 0; cursor: pointer; overflow: hidden; 
            
            --clip-path: polygon(
                0 10px, 5px 10px, 5px 5px, 10px 5px, 10px 0, 
                calc(100% - 10px) 0, calc(100% - 10px) 5px, calc(100% - 5px) 5px, calc(100% - 5px) 10px, 100% 10px, 
                100% calc(100% - 10px), calc(100% - 5px) calc(100% - 10px), calc(100% - 5px) calc(100% - 5px), calc(100% - 10px) calc(100% - 5px), calc(100% - 10px) 100%, 
                10px 100%, 10px calc(100% - 5px), 5px calc(100% - 5px), 5px calc(100% - 10px), 0 calc(100% - 10px)
            );
            clip-path: var(--clip-path); -webkit-clip-path: var(--clip-path);
            transition: transform 0.6s ease;
        }
        
        .s__bar.scrolled .btn-cta { transform: scale(0.9); }

        .stripes-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; z-index: 0; }
        .stripe { flex: 1; height: 100%; background: var(--color-brand-1); transform: scaleX(1.1); will-change: transform; }
        .btn-cta_inner { position: relative; z-index: 2; pointer-events: none; }

        @keyframes harmonicA {
            0%, 100% { transform: translateX(0) scaleX(1.1); }
            25% { transform: translateX(-4px) scaleX(1.1); }
            75% { transform: translateX(4px) scaleX(1.1); }
        }
        @keyframes harmonicB {
            0%, 100% { transform: translateX(0) scaleX(1.1); }
            50% { transform: translateX(2px) scaleX(1.1); }
        }

        .btn-cta:hover .stripe { animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
        .btn-cta:hover .s1 { animation-name: harmonicA; animation-duration: 0.7s; }
        .btn-cta:hover .s2 { animation-name: harmonicB; animation-duration: 0.9s; animation-delay: 0.1s; }
        .btn-cta:hover .s3 { animation-name: harmonicA; animation-duration: 1.1s; animation-direction: reverse; }
        .btn-cta:hover .s4 { animation-name: harmonicB; animation-duration: 0.8s; animation-delay: 0.2s; }
        .btn-cta:hover .s5 { animation-name: harmonicA; animation-duration: 1.2s; }
        .btn-cta:hover .s6 { animation-name: harmonicB; animation-duration: 0.6s; animation-direction: reverse; }
        .btn-cta:hover .s7 { animation-name: harmonicA; animation-duration: 1.0s; }
        .btn-cta:hover .s8 { animation-name: harmonicB; animation-duration: 1.3s; }

    </style>
</head>
<body>

    <div class="hero-placeholder">
        Scroll Down<br>to see animation
    </div>

    <div class="s__bar" id="navbar">
        <div class="section logo-sec">
            <div class="logo-circle">
                <div class="logo-num top">24</div>
                <div class="logo-line"></div>
                <div class="logo-num bottom">7</div>
            </div>
        </div>

        <div class="section brand-sec">24/7Artists</div>

        <div class="section info-sec">
            A personalized music career<br>plan for independent artists.
        </div>

        <div class="section login-sec">
            <a href="#" class="btn-login">Login</a>
        </div>

        <div class="section cta-sec">
            <a href="#" class="btn-cta">
                <div class="stripes-bg">
                    <span class="stripe s1"></span>
                    <span class="stripe s2"></span>
                    <span class="stripe s3"></span>
                    <span class="stripe s4"></span>
                    <span class="stripe s5"></span>
                    <span class="stripe s6"></span>
                    <span class="stripe s7"></span>
                    <span class="stripe s8"></span>
                </div>
                <span class="btn-cta_inner">Create Account</span>
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>

</body>
</html>
